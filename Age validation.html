<!DOCTYPE html>
<html>
<head>
<script>
function validateForm() {

    var x = document.forms["myForm"]["fname"].value;
    if (x === "") {
        alert("Name must be filled out");
        return false;
    }

    var y = document.getElementById("age");

    if (y.checkValidity()) {
        document.getElementById("message").innerHTML = y.validationMessage;
        return false;
    }

    if (y.value < 18) {
        document.getElementById("message").innerHTML = "You must be 18 or older.";
        return false;
    }

    document.getElementById("message").innerHTML = "Login successful";
    return false;
}
</script>
</head>

<body>

<form name="myForm" onsubmit="return validateForm()">
    
    Name: <input type="text" name="fname"><br><br>

    Age: <input id="age" type="number" min="18" max="300" required><br><br>

    <input type="submit" value="Submit">

</form>

<p id="message"></p>

</body>
</html>
