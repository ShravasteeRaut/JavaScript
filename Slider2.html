<!DOCTYPE html>
<html>
    <head>
        <style>
            body {
                background-color: #95d1ef;
                text-align: center;
                font-family: Arial, sans-serif;
            }

            section {
                margin-top: 30px;
            }

            .mySlides {
                border-radius: 10px;
                box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
                max-width: 90%;
            }
        </style>
    </head>
    <body>
        <section>
            <img class="mySlides" src="Fruit sandwich.jpg" style="height:500px;">
            <img class="mySlides" src="Matcha icecream.jpg" style="height:500px;">
            <img class="mySlides" src="Mochi.jpg" style="height:500px;">
            <img class="mySlides" src="Cloud cake.jpg" style="height:500px;">
            </section>

            <script>

           var myIndex = 0;  
           carousel();
           
           function carousel() {
            var i;
            var x = document.getElementsByClassName("mySlides");
            for (i = 0; i < x.length; i++) {
                x[i].style.display = "none";
            }
            myIndex++;
            if (myIndex > x.length) {myIndex = 1}
            x[myIndex-1].style.display = "block";
            setTimeout(carousel, 2000);
        }
        </script>
        </body>
        </html>
