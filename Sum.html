<!DOCTYPE html>
<html>
<head>
    <title>Sum of Arguments</title>
</head>
<body>

<h1>Sum of Arguments</h1>
<p id="result"></p>

<script>
function sum() {
    let total = 0;
    
    for (let i = 0; i < arguments.length; i++) {
        total += arguments[i];
    }

    return total;
}

let answer = sum(5, 10, 15, 20);

document.getElementById("result").textContent =
    "The sum is: " + answer;
</script>

</body>
</html>
